[project]
name = "django-foundation"
version = "0.1.0"
description = "Shared Django plumbing: captcha, rate limits and security headers; two-factor sign-in; Hatchet jobs; database backups and rollbacks"
authors = [{ name = "Ruan" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-allauth[mfa]>=65.23,<66",
    "django-altcha>=1.0.0",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "hatchet-sdk>=1.43.0",
    "psycopg[binary]>=3.3.6",
]

[project.optional-dependencies]
# Backups to Amazon S3 (or an S3-compatible service).
s3 = ["boto3>=1.44.9"]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    { include-group = "lint" },
]
# Just ruff, so CI's lint job installs nothing else.
lint = ["ruff>=0.17.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundation"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
