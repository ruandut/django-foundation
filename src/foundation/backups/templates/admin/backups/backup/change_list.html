{% extends "admin/change_list.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  .back-up-now { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; margin: 0 0 12px; }
  .back-up-now label { font-weight: 600; }
  .back-up-now select { max-width: 100%; }
</style>
{% endblock %}

{% block object-tools %}
<form class="back-up-now" method="post" action="{% url 'admin:backups_backup_back_up_now' %}">
  {% csrf_token %}
  <label for="back-up-target">Back up to</label>
  <select id="back-up-target" name="target">
    {% for value, label in back_up_targets %}
      <option value="{{ value }}">{{ label }}</option>
    {% endfor %}
  </select>
  <input type="submit" class="default" value="Back up now">
</form>
{{ block.super }}
{% endblock %}
