name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the service container above, nothing else.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/foundation
      # pg_dump must be at least the server's version; the runner's own is older.
      PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
    steps:
      - uses: actions/checkout@v4

      - name: Install the Postgres 18 client (pg_dump, pg_restore)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-18

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -rs
