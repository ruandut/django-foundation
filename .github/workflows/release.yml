name: Release

# After CI passes on main: if pyproject.toml's version has no tag yet, build the package, tag
# that commit vX.Y.Z and publish a GitHub Release with the wheel and sdist. Merges that don't
# change the version release nothing. A version like 0.3.0rc1 is marked as a pre-release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only a CI run for a push to main that passed: never for pull requests, never on red.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
          # PEP 440 pre-releases: 1.2.0a1, 1.2.0b2, 1.2.0rc1, 1.2.0.dev1
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.version.outputs.new == 'true'

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: uv build

      - name: Tag and publish the release
        if: steps.version.outputs.new == 'true'
        run: |
          flags=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            "${flags[@]}"
